apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: mock-ekyc-hpa
  namespace: startup-tenant-alpha

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mock-ekyc-api

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 1